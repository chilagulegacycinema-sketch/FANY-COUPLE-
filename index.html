<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<title>FANY COUPLE 💕</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * { box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial; color: white; margin: 0; height: 100vh; overflow: hidden; }

  /* BACKGROUND INAJAA KWA KILA SIMU */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: url('https://i.postimg.cc/k46vWLTz/file-0000052fc81f48073a7bd2bd68fb7.png') no-repeat center;
    background-size: cover;
    filter: brightness(0.35);
    z-index: -1;
  }

  #login, #selectProfile { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); }
  #login h1, #selectProfile h2 { font-size: 28px; letter-spacing: 3px; margin-bottom: 10px; text-shadow: 0 0 10px #ff0099; }
  #login input { padding: 15px; width: 80%; max-width: 300px; border: none; border-radius: 25px; text-align: center; font-size: 18px; margin-bottom: 15px; }
  #login button { padding: 15px 40px; border: none; border-radius: 25px; background: linear-gradient(90deg, #ff0099, #ff66cc); color: #fff; font-weight: bold; font-size: 18px; cursor: pointer; }
.error { color: #ffcccc; margin-top: 10px; display: none; }

.profile-choice { display: flex; gap: 30px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
.profile-btn { text-align: center; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.1); padding: 15px; border-radius: 20px; }
.profile-btn:hover { transform: scale(1.1); background: rgba(255,255,255,0.2); }
.profile-btn img { width: 100px; height: 100px; border-radius: 50%; border: 4px solid #fff; object-fit: cover; }
.profile-btn.name { margin-top: 8px; font-weight: bold; font-size: 16px; }
.verified { color: #0099ff; font-size: 14px; }

  #app { display: none; flex-direction: column; height: 100%; background: rgba(0,0,0,0.3); }
.header { background: rgba(255,0,153,0.85); padding: 10px 15px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(10px); }
.header-left { display: flex; align-items: center; gap: 12px; }
.app-logo { width:50px; height:50px; border-radius:50%; border:3px solid #fff; object-fit: cover; }
.header.title { font-size: 18px; font-weight: bold; letter-spacing: 2px; }
.header-right { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 5px 10px; border-radius: 20px; transition: 0.3s; }
.header-right:hover { background: rgba(255,255,255,0.1); }
.header-profile { width:40px; height:40px; border-radius:50%; border:2px solid #fff; object-fit: cover; }
.header-info { text-align: right; font-size: 12px; }
.header-info.name { font-weight: bold; font-size: 14px; }
.header-info.logout { color: #ffcccc; font-size: 11px; }

  #chat { flex: 1; overflow-y: auto; padding: 15px; }
.msg { margin: 12px 0; max-width: 78%; display: flex; gap: 10px; }
.msg.me { margin-left: auto; flex-direction: row-reverse; }
.profile-mini img { width: 35px; height: 35px; border-radius: 50%; object-fit: cover; border: 2px solid #ff66cc; }
.verified-badge { color: #0099ff; font-size: 12px; position: relative; top: -25px; left: 20px; background: rgba(0,0,0,0.5); border-radius: 50%; padding: 0 3px; }
.bubble { padding: 12px; border-radius: 18px; backdrop-filter: blur(5px); }
.me.bubble { background: linear-gradient(135deg, rgba(255,0,153,0.9), rgba(255,102,204,0.9)); color: #fff; }
.her.bubble { background: rgba(42,0,51,0.85); }
.msg-info { font-size: 11px; margin-bottom: 4px; font-weight: bold; }

.input-area { display: flex; padding: 12px; background: rgba(26,0,31,0.85); gap: 8px; align-items: center; backdrop-filter: blur(10px); }
  input[type="text"] { flex: 1; padding: 14px; border: none; border-radius: 25px; background: rgba(42,0,51,0.8); color: white; outline: none; }
  button.icon, label { padding: 12px 16px; border: none; border-radius: 25px; background: linear-gradient(90deg, #ff0099, #ff66cc); color: white; cursor: pointer; font-size: 18px; }
  input[type="file"] { display: none; }
  img.chat-img { max-width: 220px; border-radius: 12px; margin-top: 5px; }
  audio { width: 220px; margin-top: 5px; border-radius: 20px; }
</style>
</head>
<body>

  <!-- 1. SCREEN YA PIN -->
  <div id="login">
    <h1>FANY COUPLE</h1>
    <p>Weka neno la siri kuingia 💖</p>
    <input type="password" id="password" placeholder="Neno la siri">
    <button onclick="checkLogin()">Fungua</button>
    <div class="error" id="error">Neno la siri si sahihi!</div>
  </div>

  <!-- 2. SCREEN YA KUCHAGUA PROFILE -->
  <div id="selectProfile" style="display:none;">
    <h2>Nani anatumia sasa?</h2>
    <div class="profile-choice">
      <div class="profile-btn" onclick="selectUser('SmartBoe')">
        <img src="https://i.postimg.cc/N0Qn7GXm/file-00000a7e081f48a9f6e56641d5f90.png">
        <div class="name">SmartBoe <span class="verified">✓</span></div>
      </div>
      <div class="profile-btn" onclick="selectUser('Baby Faah')">
        <img src="https://i.postimg.cc/br4MQQ0f/file-0000090a481f4b95cc5a1ddff62c0.png">
        <div class="name">Baby Faah <span class="verified">✓</span></div>
      </div>
    </div>
  </div>

  <!-- 3. SCREEN YA CHAT -->
  <div id="app">
    <div class="header">
      <div class="header-left">
        <img src="https://i.postimg.cc/k46vWLTz/file-0000052fc81f48073a7bd2bd68fb7.png" class="app-logo">
        <div class="title">FANY COUPLE</div>
      </div>
      <div class="header-right" onclick="logout()">
        <div class="header-info">
          <div class="name" id="header-name"></div>
          <div class="logout">Toka</div>
        </div>
        <img src="" class="header-profile" id="header-pic">
      </div>
    </div>
    <div id="chat"></div>
    <div class="input-area">
      <input type="text" id="message" placeholder="Andika ujumbe...">
      <label for="pic">🖼️</label>
      <input type="file" id="pic" accept="image/*">
      <button class="icon" id="rec">🎤</button>
      <button class="icon" onclick="sendText()">➤</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";
  import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";

  const SECRET_PASSWORD = "FANY";
  const PROFILES = {
    "SmartBoe": "https://i.postimg.cc/N0Qn7GXm/file-00000a7e081f48a9f6e56641d5f90.png",
    "Baby Faah": "https://i.postimg.cc/br4MQQ0f/file-0000090a481f4b95cc5a1ddff62c0.png"
  };

  let myName = ""; let myPic = "";
  let db, storage, chatRef;

  function checkLogin() {
    const input = document.getElementById("password").value.toUpperCase();
    if(input === SECRET_PASSWORD) {
      document.getElementById("login").style.display = "none";
      document.getElementById("selectProfile").style.display = "flex";
    } else {
      document.getElementById("error").style.display = "block";
      setTimeout(()=>{document.getElementById("error").style.display = "none"}, 3000);
    }
  }
  document.getElementById("password").addEventListener("keypress", e => { if(e.key === "Enter") checkLogin(); });

  window.selectUser = function(name) {
    myName = name;
    myPic = PROFILES[name];
    document.getElementById("header-name").innerText = myName;
    document.getElementById("header-pic").src = myPic;
    document.getElementById("selectProfile").style.display = "none";
    document.getElementById("app").style.display = "flex";
    startChat();
  }

  window.logout = function() {
    document.getElementById("app").style.display = "none";
    document.getElementById("login").style.display = "flex";
    document.getElementById("password").value = "";
    document.getElementById("chat").innerHTML = "";
  }

  function startChat() {
    // HII HAPA CONFIG KAMILI YA FIREBASE YAKO
    const firebaseConfig = {
      databaseURL: "https://chilx-live-4432d-default-rtdb.firebaseio.com"
    };
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    storage = getStorage("gs://chilx-live-4432d.appspot.com");
    chatRef = ref(db, "fany-couple-chat");
    loadMessages();
  }

  let isRecording = false; let mediaRecorder; let audioChunks = [];
  window.sendText = function() {
    const msg = document.getElementById("message").value;
    if(msg.trim() === "") return;
    push(chatRef, { name: myName, pic: myPic, type: "text", content: msg, time: Date.now() });
    document.getElementById("message").value = "";
  }

  document.getElementById("pic").onchange = async (e) => {
    const file = e.target.files[0]; if(!file) return;
    const storageRef = sRef(storage, 'fany-pics/' + Date.now() + file.name);
    const snap = await uploadBytes(storageRef, file); const url = await getDownloadURL(snap.ref);
    push(chatRef, { name: myName, pic: myPic, type: "image", content: url, time: Date.now() });
  }

  document.getElementById("rec").onclick = async () => {
    if(!isRecording){
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        const storageRef = sRef(storage, 'fany-voice/' + Date.now() + '.webm');
        const snap = await uploadBytes(storageRef, blob); const url = await getDownloadURL(snap.ref);
        push(chatRef, { name: myName, pic: myPic, type: "audio", content: url, time: Date.now() }); audioChunks = [];
      };
      mediaRecorder.start(); document.getElementById("rec").innerText = "⏹️"; isRecording = true;
    } else { mediaRecorder.stop(); document.getElementById("rec").innerText = "🎤"; isRecording = false; }
  }

  function loadMessages() {
    onChildAdded(chatRef, (data) => {
      const msg = data.val(); const chatBox = document.getElementById("chat"); const div = document.createElement("div");
      div.classList.add("msg");
      const isMe = msg.name === myName;
      if(isMe) div.classList.add("me");

      let content = `
        <div class="profile-mini">
          <img src="${msg.pic}">
          <div class="verified-badge">✓</div>
        </div>
        <div>
          <div class="msg-info">${msg.name}</div>
          <div class="bubble">`;

      if(msg.type === "text") content += msg.content;
      if(msg.type === "image") content += `<img class="chat-img" src="${msg.content}">`;
      if(msg.type === "audio") content += `<audio controls src="${msg.content}"></audio>`;
      content += `</div></div>`;

      div.innerHTML = content; chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
    });
  }
  document.getElementById("message").addEventListener("keypress", e => { if(e.key === "Enter") sendText(); });
</script>
</body>
</html>
