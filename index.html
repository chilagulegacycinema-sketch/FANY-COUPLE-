<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<title>FANY COUPLE 💕</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
    * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { font-family: 'Segoe UI', Arial; color: white; }

  /* BACKGROUND INAJAA KILA SIMU */
  body::before {
    content: "";
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    background: url('https://i.postimg.cc/k46vWLTz/file-0000052fc81f48073a7bd2bd68fb7.png') no-repeat center;
    background-size: cover;
    filter: brightness(0.3);
    z-index: -1;
  }

  #login, #selectProfile { display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(8px); }
  #login h1, #selectProfile h2 { font-size: 32px; letter-spacing: 4px; margin-bottom: 15px; text-shadow: 0 0 15px #ff0099; }
  #login p { font-size: 16px; margin-bottom: 20px; }
  #login input { padding: 16px; width: 85%; max-width: 320px; border: 2px solid #ff66cc; border-radius: 25px; text-align: center; font-size: 18px; margin-bottom: 15px; background: rgba(255,255,255,0.1); color: white; outline: none; }
  #login button { padding: 16px 45px; border: none; border-radius: 25px; background: linear-gradient(90deg, #ff0099, #ff66cc); color: #fff; font-weight: bold; font-size: 18px; cursor: pointer; box-shadow: 0 0 20px #ff0099; }
.error { color: #ff6666; margin-top: 10px; display: none; font-weight: bold; }

.profile-choice { display: flex; gap: 40px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
.profile-btn { text-align: center; cursor: pointer; transition: 0.3s; background: rgba(255,255,255,0.1); padding: 20px; border-radius: 25px; border: 2px solid transparent; }
.profile-btn:hover { transform: scale(1.1); background: rgba(255,0,153,0.3); border: 2px solid #ff66cc; }
.profile-btn img { width: 110px; height: 110px; border-radius: 50%; border: 4px solid #fff; object-fit: cover; box-shadow: 0 0 15px #ff0099; }
.profile-btn.name { margin-top: 10px; font-weight: bold; font-size: 17px; }
.verified { color: #0099ff; font-size: 15px; }

  #app { display: none; flex-direction: column; height: 100dvh; }

  /* HEADER TRANSPARENT */
.header { background: rgba(0,0,0,0.15); padding: 12px 15px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255,255,255,0.15); flex-shrink: 0; }
.header-left { display: flex; align-items: center; gap: 12px; }
.app-logo { width:52px; height:52px; border-radius:50%; border:3px solid #fff; object-fit: cover; }
.header.title { font-size: 19px; font-weight: bold; letter-spacing: 2px; text-shadow: 0 0 8px #000; }
.header-right { display: flex; align-items: center; gap: 10px; cursor: pointer; padding: 6px 12px; border-radius: 25px; transition: 0.3s; position: relative; }
.header-right:hover { background: rgba(255,255,255,0.15); }
.header-profile { width:42px; height:42px; border-radius:50%; border:2px solid #fff; object-fit: cover; }
.header-info { text-align: right; font-size: 12px; text-shadow: 0 0 5px #000; }
.header-info.name { font-weight: bold; font-size: 15px; }
.header-info.logout { color: #ff99cc; font-size: 11px; }

/* DROPDOWN YA MANAGE ACCOUNT */
.dropdown { display: none; position: absolute; top: 50px; right: 0; background: rgba(0,0,0,0.9); border-radius: 12px; padding: 10px; min-width: 160px; backdrop-filter: blur(10px); border: 1px solid #ff66cc; }
.dropdown button { width: 100%; padding: 10px; background: transparent; border: none; color: white; text-align: left; cursor: pointer; border-radius: 8px; }
.dropdown button:hover { background: rgba(255,0,153,0.3); }
.dropdown.danger { color: #ff6666; }

  /* CHAT SCROLL JUU CHINI */
  #chat { flex: 1; overflow-y: auto; padding: 15px; }
.msg { margin: 14px 0; max-width: 80%; display: flex; gap: 10px; animation: fadeIn 0.3s; }
@keyframes fadeIn { from {opacity: 0; transform: translateY(10px);} to {opacity: 1; transform: translateY(0);} }
.msg.me { margin-left: auto; flex-direction: row-reverse; }
.profile-mini img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; border: 2px solid #ff66cc; }
.verified-badge { color: #0099ff; font-size: 13px; position: relative; top: -28px; left: 22px; background: rgba(0,0,0,0.6); border-radius: 50%; padding: 1px 4px; }
.bubble { padding: 13px 16px; border-radius: 20px; backdrop-filter: blur(10px); max-width: 100%; word-wrap: break-word; }
.me.bubble { background: linear-gradient(135deg, rgba(255,0,153,0.95), rgba(255,102,204,0.95)); color: #fff; box-shadow: 0 3px 10px rgba(255,0,153,0.3); }
.her.bubble { background: rgba(30,0,40,0.85); box-shadow: 0 3px 10px rgba(0,0,0,0.3); }
.msg-info { font-size: 11px; margin-bottom: 5px; font-weight: bold; text-shadow: 0 0 3px #000; }
img.chat-img { max-width: 100%; border-radius: 15px; margin-top: 6px; border: 2px solid #ff66cc; }

.input-area { display: flex; padding: 12px; background: rgba(0,0,0,0.25); gap: 8px; align-items: center; backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.15); flex-shrink: 0; }
  input[type="text"] { flex: 1; padding: 15px; border: 2px solid rgba(255,102,204,0.3); border-radius: 25px; background: rgba(42,0,51,0.8); color: white; outline: none; font-size: 16px; }
  button.icon { padding: 13px 17px; border: none; border-radius: 25px; background: linear-gradient(90deg, #ff0099, #ff66cc); color: white; cursor: pointer; font-size: 19px; box-shadow: 0 0 10px #ff0099; }
  button.icon:active { transform: scale(0.9); }
</style>
</head>
<body>

  <!-- 1. LOGIN -->
  <div id="login">
    <h1>FANY COUPLE</h1>
    <p>Weka neno la siri kuingia 💖</p>
    <input type="password" id="password" placeholder="Neno la siri">
    <button id="loginBtn">Fungua</button>
    <div class="error" id="error">Neno la siri si sahihi!</div>
  </div>

  <!-- 2. CHAGUA PROFILE -->
  <div id="selectProfile" style="display:none;">
    <h2>Nani anatumia sasa?</h2>
    <div class="profile-choice">
      <div class="profile-btn" data-name="SmartBoe">
        <img src="https://i.postimg.cc/N0Qn7GXm/file-00000a7e081f48a9f6e56641d5f90.png">
        <div class="name">SmartBoe <span class="verified">✓</span></div>
      </div>
      <div class="profile-btn" data-name="Baby Faah">
        <img src="https://i.postimg.cc/br4MQQ0f/file-0000090a481f4b95cc5a1ddff62c0.png">
        <div class="name">Baby Faah <span class="verified">✓</span></div>
      </div>
    </div>
  </div>

  <!-- 3. CHAT -->
  <div id="app">
    <div class="header">
      <div class="header-left">
        <img src="https://i.postimg.cc/k46vWLTz/file-0000052fc81f48073a7bd2bd68fb7.png" class="app-logo">
        <div class="title">FANY COUPLE</div>
      </div>
      <div class="header-right" id="profileMenu">
        <div class="header-info">
          <div class="name" id="header-name"></div>
          <div class="logout">Mipangilio</div>
        </div>
        <img src="" class="header-profile" id="header-pic">
        <div class="dropdown" id="dropdown">
          <button onclick="clearChat()">🗑️ Futa Ujumbe Wote</button>
          <button class="danger" onclick="logout()">🚪 Toka</button>
        </div>
      </div>
    </div>
    <div id="chat"></div>
    <div class="input-area">
      <input type="text" id="message" placeholder="Andika ujumbe au weka link ya picha...">
      <button class="icon" id="sendBtn">➤</button>
    </div>
  </div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, push, onChildAdded, remove } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const SECRET_PASSWORD = "FANY";
  const PROFILES = {
    "SmartBoe": "https://i.postimg.cc/N0Qn7GXm/file-00000a7e081f48a9f6e56641d5f90.png",
    "Baby Faah": "https://i.postimg.cc/br4MQQ0f/file-0000090a481f4b95cc5a1ddff62c0.png"
  };

  let myName = ""; let myPic = "";
  let db, chatRef;

  document.getElementById("loginBtn").addEventListener("click", checkLogin);
  document.getElementById("password").addEventListener("keypress", e => { if(e.key === "Enter") checkLogin(); });
  document.querySelectorAll(".profile-btn").forEach(btn => {
    btn.addEventListener("click", () => selectUser(btn.dataset.name));
  });
  document.getElementById("sendBtn").addEventListener("click", sendText);
  document.getElementById("message").addEventListener("keypress", e => { if(e.key === "Enter") sendText(); });

  // DROPDOWN YA PROFILE
  document.getElementById("profileMenu").addEventListener("click", (e) => {
    e.stopPropagation();
    const dd = document.getElementById("dropdown");
    dd.style.display = dd.style.display === "block"? "none" : "block";
  });
  document.body.addEventListener("click", () => {
    document.getElementById("dropdown").style.display = "none";
  });

  function checkLogin() {
    const input = document.getElementById("password").value.trim();
    if(input.toUpperCase() === SECRET_PASSWORD) {
      document.getElementById("login").style.display = "none";
      document.getElementById("selectProfile").style.display = "flex";
    } else {
      document.getElementById("error").style.display = "block";
      setTimeout(()=>{document.getElementById("error").style.display = "none"}, 3000);
    }
  }

  function selectUser(name) {
    myName = name;
    myPic = PROFILES[name];
    document.getElementById("header-name").innerText = myName;
    document.getElementById("header-pic").src = myPic;
    document.getElementById("selectProfile").style.display = "none";
    document.getElementById("app").style.display = "flex";
    startChat();
  }

  window.logout = function() {
    document.getElementById("app").style.display = "none";
    document.getElementById("login").style.display = "flex";
    document.getElementById("password").value = "";
    document.getElementById("chat").innerHTML = "";
  }

  window.clearChat = function() {
    if(confirm("Una uhakika unataka kufuta ujumbe wote?")) {
      remove(chatRef);
      document.getElementById("chat").innerHTML = "";
      document.getElementById("dropdown").style.display = "none";
    }
  }

  function startChat() {
    const firebaseConfig = {
      databaseURL: "https://chilx-live-4432d-default-rtdb.firebaseio.com"
    };
    const app = initializeApp(firebaseConfig);
    db = getDatabase(app);
    chatRef = ref(db, "fany-couple-chat");
    loadMessages();
  }

  function sendText() {
    const msg = document.getElementById("message").value.trim();
    if(msg === "") return;

    // IKIWA NI LINK YA PICHA ITAITAMBUA AUTOMATIC
    const isImage = msg.match(/\.(jpeg|jpg|gif|png)$/)!= null || msg.includes("postimg.cc") || msg.includes("imgur");
    const type = isImage? "image" : "text";

    push(chatRef, { name: myName, pic: myPic, type: type, content: msg, time: Date.now() });
    document.getElementById("message").value = "";
  }

  function loadMessages() {
    onChildAdded(chatRef, (data) => {
      const msg = data.val(); const chatBox = document.getElementById("chat"); const div = document.createElement("div");
      div.classList.add("msg");
      const isMe = msg.name === myName;
      if(isMe) div.classList.add("me");

      let content = `
        <div class="profile-mini">
          <img src="${msg.pic}">
          <div class="verified-badge">✓</div>
        </div>
        <div>
          <div class="msg-info">${msg.name}</div>
          <div class="bubble">`;

      if(msg.type === "text") content += msg.content;
      if(msg.type === "image") content += `<img class="chat-img" src="${msg.content}" onerror="this.outerHTML='<a href=${msg.content} target=_blank>${msg.content}</a>'">`;

      content += `</div></div>`;
      div.innerHTML = content; chatBox.appendChild(div); chatBox.scrollTop = chatBox.scrollHeight;
    });
  }
</script>
</body>
</html>
